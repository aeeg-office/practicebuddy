<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lumaani App Icon — The Illuminated L -->
  
  <!-- Background (transparent — app icon platform provides rounding) -->
  <rect width="512" height="512" fill="none" />

  <!-- L Body — Dark Navy (#0b4f4a) -->
  <path d="M 130 0 L 130 380 L 440 380" 
        fill="none" stroke="#0b4f4a" stroke-width="170" 
        stroke-linecap="round" stroke-linejoin="miter" />

  <!-- Gold Flame — Light element inside the L -->
  <path d="M 210 330 
           L 210 90 
           Q 210 50 248 40 
           Q 286 30 306 60 
           L 370 330 Z" 
        fill="#c8785a" />

  <!-- Gold Base Bar -->
  <rect x="210" y="425" width="300" height="14" rx="7" fill="#c8785a" />
</svg>