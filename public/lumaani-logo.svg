<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <!-- Lumaani Full Logo — The Illuminated L + Wordmark -->

  <!-- ─── Symbol ─── -->
  <g id="lumaani-symbol" transform="translate(20, 20)">
    <!-- L Body — Dark Navy (#1a237e) -->
    <path d="M 30 30 L 30 150 L 150 150" 
          fill="none" stroke="#1a237e" stroke-width="52" 
          stroke-linecap="round" stroke-linejoin="miter" />

    <!-- Gold Flame — Light element inside the L -->
    <path d="M 55 117 L 55 50 Q 55 35 68 30 Q 81 25 89 38 L 110 117 Z" 
          fill="#f5a623" />

    <!-- Gold Base Bar -->
    <rect x="55" y="148" width="120" height="5" rx="2.5" fill="#f5a623" />
  </g>

  <!-- ─── Wordmark ─── -->
  <g id="lumaani-wordmark" transform="translate(200, 20)">
    <!-- "Lumaani" wordmark -->
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="88" font-weight="700" fill="#1a237e" letter-spacing="-3">
      <tspan x="0" dy="115">Lumaani</tspan>
    </text>
    
    <!-- Arabic equivalent (optional) -->
    <text x="3" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#1a237e" letter-spacing="-0.5" opacity="0.65">
      لوماني
    </text>
    
    <!-- Tagline -->
    <text x="110" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="400" fill="#1a237e" letter-spacing="0.8" opacity="0.5">
      Practice. Learn. Master.
    </text>
  </g>
</svg>